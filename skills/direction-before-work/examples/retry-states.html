<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Synthetic digest retry mock</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; line-height: 1.4; }
    .banner { background: #fff4cc; padding: 0.5rem 0.75rem; }
    button { margin-right: 0.5rem; }
    button:focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; }
    table { border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
    .error { color: #8a1f11; }
  </style>
</head>
<body>
  <p class="banner">SYNTHETIC teaching mock. Local state only. No mail is sent and no credentials are collected.</p>
  <h1>Weekly digests</h1>
  <p id="status" role="status" aria-live="polite">Failed. smtp_timeout. Retry has not been queued.</p>
  <button type="button" id="retry">Retry synthetic-104</button>
  <button type="button" id="empty">Show empty list</button>
  <button type="button" id="denied">Show permission denied</button>
  <table>
    <caption>Synthetic digest row</caption>
    <thead>
      <tr><th scope="col">Digest</th><th scope="col">Status</th><th scope="col">Retry</th></tr>
    </thead>
    <tbody id="rows">
      <tr><td>synthetic-104</td><td id="row-status">Failed</td><td id="row-retry">none</td></tr>
    </tbody>
  </table>
  <script>
    const status = document.getElementById("status");
    const rowStatus = document.getElementById("row-status");
    const rowRetry = document.getElementById("row-retry");
    const rows = document.getElementById("rows");
    let queued = false;

    function showRow() {
      rows.innerHTML = '<tr><td>synthetic-104</td><td id="row-status">Failed</td><td id="row-retry">none</td></tr>';
    }

    document.getElementById("retry").addEventListener("click", function () {
      if (!document.getElementById("row-status")) {
        showRow();
      }
      if (queued) {
        status.textContent = "Error. retry_already_in_flight. The original row is unchanged. Nothing was sent.";
        status.className = "error";
        return;
      }
      status.className = "";
      status.textContent = "Loading. Checking whether a retry is already queued.";
      window.setTimeout(function () {
        queued = true;
        const currentStatus = document.getElementById("row-status");
        const currentRetry = document.getElementById("row-retry");
        if (currentStatus && currentRetry) {
          currentStatus.textContent = "Failed";
          currentRetry.textContent = "queued";
        }
        status.textContent = "Retry queued. Status remains failed. No message was sent.";
      }, 300);
    });

    document.getElementById("empty").addEventListener("click", function () {
      queued = false;
      rows.textContent = "";
      status.className = "";
      status.textContent = "Empty list. There is no digest to retry.";
    });

    document.getElementById("denied").addEventListener("click", function () {
      showRow();
      queued = false;
      status.className = "error";
      status.textContent = "Permission denied. This account cannot queue a retry. No sign-in form is shown.";
    });
  </script>
</body>
</html>
